name: TypeScript/Node.js CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      npm_config_engine_strict: true
    strategy:
      matrix:
        node-version: [20.19.0, 22.12.0, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Detect package manager
        id: detect
        run: |
          if [ -f "pnpm-lock.yaml" ]; then
            echo "pm=pnpm" >> $GITHUB_OUTPUT
          elif [ -f "yarn.lock" ]; then
            echo "pm=yarn" >> $GITHUB_OUTPUT
          elif [ -f "package-lock.json" ] || [ -f "package.json" ]; then
            echo "pm=npm" >> $GITHUB_OUTPUT
          else
            echo "pm=none" >> $GITHUB_OUTPUT
          fi

      - name: Install pnpm
        if: steps.detect.outputs.pm == 'pnpm'
        run: npm install -g pnpm

      - name: Install dependencies
        if: steps.detect.outputs.pm != 'none'
        run: |
          if [ "${{ steps.detect.outputs.pm }}" == "pnpm" ]; then
            pnpm install --frozen-lockfile
          elif [ "${{ steps.detect.outputs.pm }}" == "yarn" ]; then
            yarn install --frozen-lockfile
          else
            npm ci
          fi

      - name: Lint with ESLint
        if: steps.detect.outputs.pm != 'none'
        run: |
          if [ "${{ steps.detect.outputs.pm }}" == "pnpm" ]; then
            pnpm run lint
          elif [ "${{ steps.detect.outputs.pm }}" == "yarn" ]; then
            yarn lint
          else
            npm run lint
          fi

      - name: Type check with tsc
        if: steps.detect.outputs.pm != 'none' && hashFiles('tsconfig.json') != ''
        run: |
          if [ -f "tsconfig.json" ]; then
            npx tsc --noEmit
          else
            echo "::notice::No tsconfig.json found, skipping type checking"
          fi

      - name: Run tests
        if: steps.detect.outputs.pm != 'none'
        run: |
          if [ "${{ steps.detect.outputs.pm }}" == "pnpm" ]; then
            pnpm test -- --coverage
          elif [ "${{ steps.detect.outputs.pm }}" == "yarn" ]; then
            yarn test --coverage
          else
            npm test -- --coverage
          fi

      - name: Upload coverage to Codecov
        if: success() && hashFiles('coverage/lcov.info') != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          flags: unittests
          name: codecov-${{ matrix.node-version }}

      - name: Build
        if: steps.detect.outputs.pm != 'none'
        run: |
          if [ "${{ steps.detect.outputs.pm }}" == "pnpm" ]; then
            pnpm run build
          elif [ "${{ steps.detect.outputs.pm }}" == "yarn" ]; then
            yarn build
          else
            npm run build
          fi
